# Déploiement Netlify.
#
# Le jeu est entièrement statique : aucun appel serveur, tout vit dans le
# navigateur (localStorage). `pnpm build` produit AUSSI un bundle serveur dans
# dist/, qui ne sert qu'à l'aperçu local — ce qu'il faut publier, c'est
# uniquement dist/public.

[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  # Corepack installe la version de pnpm épinglée dans package.json.
  NPM_FLAGS = "--version"

# L'application est une page unique (wouter gère les routes côté navigateur) :
# toute URL doit renvoyer index.html, sinon un rechargement tombe sur un 404.
# Un média absent doit répondre 404, pas la page d'accueil : sinon le jeu
# télécharge index.html à la place d'un son et ne s'en aperçoit qu'au décodage.
# Les fichiers qui existent sont servis avant toute redirection.
[[redirects]]
  from = "/audio/*"
  to = "/media-absent"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "/media-absent"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le hachage des noms de fichiers permet un cache long sur les ressources ;
# index.html, lui, doit toujours être revalidé pour livrer la nouvelle version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les 14 Mo de sons n'avaient AUCUNE règle : chaque visite les revalidait un
# par un, et le lit sonore du quartier arrivait après le silence. Un mois, et
# pas un an comme les images : ces fichiers ne sont pas hachés, et la
# bibliothèque audio est appelée à être remplacée — un cache éternel condamnerait
# les joueurs déjà venus à garder l'ancienne pendant douze mois.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
